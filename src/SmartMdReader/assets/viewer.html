<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src https://app.smartmd; style-src https://app.smartmd 'unsafe-inline'; img-src https: http: data:; media-src https://doc.smartmd; font-src https://app.smartmd data:">
  <base id="doc-base" href="https://app.smartmd/">
  <title>SmartMdReader</title>
  <link id="md-light" rel="stylesheet" href="https://app.smartmd/vendor/github-markdown-light.css">
  <link id="md-dark" rel="stylesheet" href="https://app.smartmd/vendor/github-markdown-dark.css" disabled>
  <link id="hl-light" rel="stylesheet" href="https://app.smartmd/vendor/hljs-light.min.css">
  <link id="hl-dark" rel="stylesheet" href="https://app.smartmd/vendor/hljs-dark.min.css" disabled>
  <link rel="stylesheet" href="https://app.smartmd/viewer.css">
  <script src="https://app.smartmd/vendor/highlight.min.js"></script>
  <script src="https://app.smartmd/vendor/languages/powershell.min.js"></script>
  <script src="https://app.smartmd/vendor/languages/dockerfile.min.js"></script>
  <script src="https://app.smartmd/vendor/languages/nginx.min.js"></script>
  <script src="https://app.smartmd/vendor/languages/apache.min.js"></script>
  <script src="https://app.smartmd/vendor/languages/dos.min.js"></script>
  <script src="https://app.smartmd/vendor/languages/properties.min.js"></script>
  <script src="https://app.smartmd/viewer.js" defer></script>
</head>
<body class="empty toc-none">
  <header id="toolbar">
    <button id="btn-toc" class="icon" data-i18n-title="ui.btn.toc">☰</button>
    <button id="btn-back" class="icon" data-i18n-title="ui.btn.back" disabled>←</button>
    <button id="btn-open" data-i18n="ui.btn.open" data-i18n-title="ui.btn.openTitle"></button>
    <div id="file-info">
      <span id="file-name"></span>
      <span id="file-path" data-i18n-title="ui.filePath.title"></span>
    </div>
    <button id="btn-reload" class="icon" data-i18n-title="ui.btn.reload">⟳</button>
    <button id="btn-theme" data-i18n-title="ui.btn.theme"></button>
    <button id="btn-settings" class="icon" data-i18n-title="ui.btn.settings">⚙</button>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <section id="files-pane" class="pane">
        <div class="pane-header" id="files-header" data-i18n-title="ui.pane.collapse">
          <span class="chevron"></span>
          <span class="pane-title" data-i18n="ui.files.title"></span>
          <span class="pane-actions">
            <button id="btn-add-files" class="pane-btn" data-i18n-title="ui.files.add">＋</button>
            <button id="btn-new-folder" class="pane-btn" data-i18n-title="ui.files.newFolder">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M1.75 2.5h4.19c.2 0 .39.08.53.22l1.06 1.06c.14.14.33.22.53.22h6.19c.41 0 .75.34.75.75v8.5c0 .41-.34.75-.75.75H1.75A.75.75 0 0 1 1 13.25V3.25c0-.41.34-.75.75-.75ZM2.5 4v8.75h11V5.5H8.06c-.6 0-1.17-.24-1.59-.66L5.63 4H2.5Zm5.5 2.5c.28 0 .5.22.5.5v1.5H10a.5.5 0 0 1 0 1H8.5V11a.5.5 0 0 1-1 0V9.5H6a.5.5 0 0 1 0-1h1.5V7c0-.28.22-.5.5-.5Z"/></svg>
            </button>
          </span>
        </div>
        <div class="pane-body" id="files-body">
          <ul id="files-list"></ul>
          <div id="files-empty" data-i18n="ui.files.empty"></div>
        </div>
      </section>
      <div id="pane-splitter"></div>
      <section id="toc-pane" class="pane">
        <div class="pane-header" id="toc-header" data-i18n-title="ui.pane.collapse">
          <span class="chevron"></span>
          <span class="pane-title" data-i18n="ui.toc.title"></span>
        </div>
        <div class="pane-body">
          <ul id="toc-list"></ul>
        </div>
      </section>
    </aside>
    <div id="sidebar-resizer"></div>
    <main id="scroller" tabindex="-1">
      <article id="content" class="markdown-body"></article>
      <section id="welcome">
        <div class="welcome-logo">MD</div>
        <h1>SmartMdReader</h1>
        <p data-i18n="ui.welcome.line1"></p>
        <p class="hint" data-i18n="ui.welcome.hint"></p>
      </section>
    </main>
  </div>

  <div id="settings-overlay">
    <div id="settings-dialog" role="dialog" aria-modal="true">
      <h2 data-i18n="ui.settings.title"></h2>
      <label class="field">
        <span data-i18n="ui.settings.language"></span>
        <select id="set-language"></select>
      </label>
      <label class="field">
        <span data-i18n="ui.settings.theme"></span>
        <select id="set-theme">
          <option value="auto" data-i18n="ui.theme.auto"></option>
          <option value="light" data-i18n="ui.theme.light"></option>
          <option value="dark" data-i18n="ui.theme.dark"></option>
        </select>
      </label>
      <label class="field checkbox">
        <input id="set-toc" type="checkbox">
        <span data-i18n="ui.settings.showToc"></span>
      </label>
      <div class="actions">
        <button id="settings-close" data-i18n="ui.settings.close"></button>
      </div>
    </div>
  </div>

  <div id="ctx-menu" role="menu"></div>
  <div id="drop-overlay"><div data-i18n="ui.drop"></div></div>
  <div id="toast"></div>
</body>
</html>
